services:
  localstack:
    ports:
      - "${LOAD_SQS_PORT:-4566}:4566"

  resilience-app-1:
    environment:
      LOAD_RUN_ID: ${LOAD_RUN_ID:-load-local}
      SQS_MAX_NUMBER_OF_MESSAGES: ${LOAD_SQS_MAX_NUMBER_OF_MESSAGES:-10}
      SQS_WAIT_TIME_SECONDS: ${LOAD_SQS_WAIT_TIME_SECONDS:-0}
      OUTBOX_POLL_INTERVAL_MS: ${LOAD_OUTBOX_POLL_INTERVAL_MS:-50}
      OUTBOX_BATCH_SIZE: ${LOAD_OUTBOX_BATCH_SIZE:-50}

  resilience-app-2:
    environment:
      LOAD_RUN_ID: ${LOAD_RUN_ID:-load-local}
      SQS_MAX_NUMBER_OF_MESSAGES: ${LOAD_SQS_MAX_NUMBER_OF_MESSAGES:-10}
      SQS_WAIT_TIME_SECONDS: ${LOAD_SQS_WAIT_TIME_SECONDS:-0}
      OUTBOX_POLL_INTERVAL_MS: ${LOAD_OUTBOX_POLL_INTERVAL_MS:-50}
      OUTBOX_BATCH_SIZE: ${LOAD_OUTBOX_BATCH_SIZE:-50}

  resilience-app-3:
    environment:
      LOAD_RUN_ID: ${LOAD_RUN_ID:-load-local}
      SQS_MAX_NUMBER_OF_MESSAGES: ${LOAD_SQS_MAX_NUMBER_OF_MESSAGES:-10}
      SQS_WAIT_TIME_SECONDS: ${LOAD_SQS_WAIT_TIME_SECONDS:-0}
      OUTBOX_POLL_INTERVAL_MS: ${LOAD_OUTBOX_POLL_INTERVAL_MS:-50}
      OUTBOX_BATCH_SIZE: ${LOAD_OUTBOX_BATCH_SIZE:-50}
